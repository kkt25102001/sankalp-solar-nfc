<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Asset Extractor</title>
</head>
<body>
  <h2>Asset Extractor</h2>
  <div id="status">Loading...</div>
  <canvas id="logoCanvas"></canvas>
  <canvas id="bottleCanvas"></canvas>
  <canvas id="bannerCanvas"></canvas>
  <textarea id="logoBase64" style="width:100%;height:100px;"></textarea>
  <textarea id="bottleBase64" style="width:100%;height:100px;"></textarea>
  <textarea id="bannerBase64" style="width:100%;height:100px;"></textarea>

  <script>
    async function processAssets() {
      const status = document.getElementById('status');
      
      const logoImg = new Image();
      logoImg.crossOrigin = "anonymous";
      logoImg.src = "file:///C:/Users/LENOVO/.gemini/antigravity-ide/brain/29675593-38d3-4698-a1e5-914f4069ba47/.user_uploaded/media_1789651748373.png";

      const posterImg = new Image();
      posterImg.crossOrigin = "anonymous";
      posterImg.src = "file:///C:/Users/LENOVO/.gemini/antigravity-ide/brain/29675593-38d3-4698-a1e5-914f4069ba47/.user_uploaded/media_1789651829488.jpg";

      await Promise.all([
        new Promise(res => logoImg.onload = res),
        new Promise(res => posterImg.onload = res)
      ]);

      // 1. Process Logo
      const logoCanvas = document.getElementById('logoCanvas');
      logoCanvas.width = logoImg.naturalWidth;
      logoCanvas.height = logoImg.naturalHeight;
      const ctxLogo = logoCanvas.getContext('2d');
      ctxLogo.drawImage(logoImg, 0, 0);
      const logoData = logoCanvas.toDataURL('image/png');
      document.getElementById('logoBase64').value = logoData;

      // 2. Process Poster / Banner
      const bannerCanvas = document.getElementById('bannerCanvas');
      bannerCanvas.width = posterImg.naturalWidth;
      bannerCanvas.height = posterImg.naturalHeight;
      const ctxBanner = bannerCanvas.getContext('2d');
      ctxBanner.drawImage(posterImg, 0, 0);
      const bannerData = bannerCanvas.toDataURL('image/jpeg', 0.92);
      document.getElementById('bannerBase64').value = bannerData;

      // 3. Crop Bottle from Poster
      // Poster dimensions: width W, height H. Bottle is on left side.
      const pw = posterImg.naturalWidth;
      const ph = posterImg.naturalHeight;
      // Bottle bounding box approx: x: 0 to 0.40 * pw, y: 0.23 * ph to 0.85 * ph
      const bx = 0;
      const by = Math.floor(ph * 0.24);
      const bw = Math.floor(pw * 0.42);
      const bh = Math.floor(ph * 0.62);

      const bottleCanvas = document.getElementById('bottleCanvas');
      bottleCanvas.width = bw;
      bottleCanvas.height = bh;
      const ctxBottle = bottleCanvas.getContext('2d');
      ctxBottle.drawImage(posterImg, bx, by, bw, bh, 0, 0, bw, bh);
      const bottleData = bottleCanvas.toDataURL('image/png');
      document.getElementById('bottleBase64').value = bottleData;

      status.innerText = "DONE! Dimensions: Logo " + logoImg.naturalWidth + "x" + logoImg.naturalHeight + ", Poster " + pw + "x" + ph;
    }

    window.addEventListener('DOMContentLoaded', processAssets);
  </script>
</body>
</html>
